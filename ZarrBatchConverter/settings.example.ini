; Settings for the Zarr Batch Converter. Run First_Time_Setup.bat to create settings.ini,
; or copy this file to settings.ini and edit it in Notepad. settings.ini is not committed.
;   zarr_folder     REQUIRED  where converted images go; must be inside the served folder
;   image_list      REQUIRED  read-only metadata workbook, rewritten on every run
;   notes_file      OPTIONAL  your own notes workbook; 'none' = do not keep one
;   screenshot_folder OPTIONAL folder for the screenshot/ROI log: one subfolder per sample plus its workbook
;   stitched_folder OPTIONAL  folder of stitched precomputed volumes to list; 'none' = no Stitched tab
;   work_folder     OPTIONAL  local scratch folder; blank = the Windows temp folder
;   ngff_converter  OPTIONAL  NGFF-Converter install folder; blank = find it automatically
;   [server] values are the same for the whole lab; change only if the web server changes

[paths]
zarr_folder = X:\nginx_share\exm\2026\zarr
image_list = X:\nginx_share\exm\2026\Zarr Image List.xlsx
notes_file = C:\Users\<you>\OneDrive - Yale University\01_Projects\pan-ASLM\Zarr Image List - Notes.xlsx
stitched_folder = X:\nginx_share\exm\2026\Stitched Precomputed NG
screenshot_folder = C:\Users\<you>\OneDrive - Yale University\09_Data & Imaging\Images\2026\Zarr Screenshots
work_folder =
ngff_converter =

[server]
served_folder = nginx_share
served_url = https://neuroglancer.kuanlab.yale.edu/data/
neuroglancer = https://neuroglancer-demo.appspot.com/
